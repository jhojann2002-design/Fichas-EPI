<!DOCTYPE html><html><body>
<script type="module">
import { PDFDocument } from 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm';
async function test() {
  const resp = await fetch('/plantillas_sppat/form_008_emergencia.pdf');
  const bytes = await resp.arrayBuffer();
  const doc = await PDFDocument.load(bytes);
  const form = doc.getForm();
  const fields = form.getFields();
  console.log('TOTAL_FIELDS:' + fields.length);
  const list = fields.map(f => f.constructor.name + ':::' + f.getName());
  console.log('FIELDS_JSON:' + JSON.stringify(list));
}
test();
</script></body></html>
